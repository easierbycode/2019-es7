<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>characters — demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050508;
      color: #9ca3af;
      font: 13px/1.5 ui-monospace, Menlo, monospace;
    }
    #app canvas { border: 1px solid #26263a; border-radius: 6px; }
    .bar { position: fixed; top: 10px; left: 12px; display: flex; gap: 10px; }
    button {
      background: #1c1c24; border: 1px solid #3a3a46; color: #ddd;
      border-radius: 5px; padding: 5px 10px; cursor: pointer; font: inherit;
    }
    button:hover { border-color: #84cc16; }
  </style>
  <!-- The module keeps `phaser` bare so a running game can supply its own
       instance; standalone pages map it to a CDN build. -->
  <script type="importmap">
    { "imports": { "phaser": "https://esm.sh/phaser@4.2.1" } }
  </script>
</head>
<body>
  <div class="bar">
    <button id="edit">open character editor</button>
  </div>
  <div id="app"></div>
  <script type="module" src="./demo.js"></script>
  <script type="module">
    import { openCharacterEditor } from "./browser.js";
    document.getElementById("edit").onclick = () => openCharacterEditor();
  </script>
</body>
</html>

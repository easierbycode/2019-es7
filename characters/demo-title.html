<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>2028.Ai title — characters demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050508;
    }
    /* Native canvas is 256x480 — scale it up, keep pixels crisp. */
    #app canvas {
      height: min(94vh, 720px);
      width: auto;
      image-rendering: pixelated;
      border: 1px solid #26263a;
      border-radius: 6px;
    }
  </style>
  <script type="importmap">
    { "imports": { "phaser": "https://esm.sh/phaser@4.2.1" } }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./demo-title.js"></script>
</body>
</html>
